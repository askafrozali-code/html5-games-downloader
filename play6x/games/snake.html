<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Play6x</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>6x</text></svg>">
<style>
  :root{--bg:#0b0e17;--tile:#161c31;--text:#eef1ff;--dim:#8b91ab;--primary:#7c5cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .wrap{width:100%;max-width:420px;text-align:center;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hud h1{font-size:20px;margin:0;}
  .score-box{background:var(--tile);border-radius:10px;padding:8px 16px;text-align:center;}
  .score-box small{display:block;color:var(--dim);font-size:10px;}
  .score-box b{font-size:18px;}
  canvas{background:#05070d;border-radius:12px;width:100%;height:auto;touch-action:none;}
  .msg{color:var(--dim);font-size:13px;margin-top:10px;}
  button{background:linear-gradient(90deg,var(--primary),#22d3ee);border:0;color:#0b0e17;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:13px;margin-top:12px;}
  .pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:14px;}
  .pad button{margin:0;padding:0;font-size:18px;}
  .pad .up{grid-column:2;grid-row:1;}
  .pad .left{grid-column:1;grid-row:2;}
  .pad .down{grid-column:2;grid-row:2;}
  .pad .right{grid-column:3;grid-row:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Snake</h1>
    <div class="score-box"><small>SCORE</small><b id="score">0</b></div>
  </div>
  <canvas id="canvas" width="360" height="360"></canvas>
  <div class="msg" id="msg">Arrow keys / WASD to move. Eat the dots, avoid your tail.</div>
  <button id="restartBtn">Restart</button>
  <div class="pad">
    <button class="up">↑</button>
    <button class="left">←</button>
    <button class="down">↓</button>
    <button class="right">→</button>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const cols=18, rows=18;
let cell;
function resize(){ cell = canvas.width/cols; }
resize();

let snake, dir, nextDir, food, score, over, timer;
const scoreEl=document.getElementById('score');
const msg=document.getElementById('msg');

function reset(){
  snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];
  dir={x:1,y:0}; nextDir=dir;
  score=0; over=false;
  scoreEl.textContent=score;
  msg.textContent='Arrow keys / WASD to move. Eat the dots, avoid your tail.';
  placeFood();
  if(timer) clearInterval(timer);
  timer=setInterval(tick, 110);
  draw();
}

function placeFood(){
  let ok=false;
  while(!ok){
    food={x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)};
    ok=!snake.some(s=>s.x===food.x&&s.y===food.y);
  }
}

function tick(){
  if(over) return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
    over=true;
    clearInterval(timer);
    msg.textContent=`Game over! Final score: ${score}. Hit Restart to play again.`;
    return;
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++; scoreEl.textContent=score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw(){
  ctx.fillStyle='#05070d';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#ff4d8d';
  ctx.fillRect(food.x*cell+2, food.y*cell+2, cell-4, cell-4);
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#22d3ee' : '#7c5cff';
    ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
  });
}

function setDir(x,y){
  if(dir.x===-x && dir.y===-y) return;
  nextDir={x,y};
}

document.addEventListener('keydown', e=>{
  const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  if(map[e.key]){ e.preventDefault(); setDir(map[e.key][0], map[e.key][1]); }
});

document.querySelector('.up').addEventListener('click', ()=>setDir(0,-1));
document.querySelector('.down').addEventListener('click', ()=>setDir(0,1));
document.querySelector('.left').addEventListener('click', ()=>setDir(-1,0));
document.querySelector('.right').addEventListener('click', ()=>setDir(1,0));
document.getElementById('restartBtn').addEventListener('click', reset);

let touchStart=null;
canvas.addEventListener('touchstart', e=>{ touchStart=[e.touches[0].clientX,e.touches[0].clientY]; }, {passive:true});
canvas.addEventListener('touchend', e=>{
  if(!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart[0];
  const dy=e.changedTouches[0].clientY-touchStart[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))>20){
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(0,dy>0?1:-1);
  }
  touchStart=null;
});

reset();
</script>
</body>
</html>
