<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker — Play6x</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>6x</text></svg>">
<style>
  :root{--bg:#0b0e17;--tile:#161c31;--text:#eef1ff;--dim:#8b91ab;--primary:#7c5cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .wrap{width:100%;max-width:480px;text-align:center;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hud h1{font-size:20px;margin:0;}
  .score-box{background:var(--tile);border-radius:10px;padding:8px 16px;}
  .score-box small{display:block;color:var(--dim);font-size:10px;}
  .score-box b{font-size:18px;}
  canvas{background:#05070d;border-radius:12px;width:100%;height:auto;touch-action:none;}
  .msg{color:var(--dim);font-size:13px;margin-top:10px;}
  button{background:linear-gradient(90deg,var(--primary),#22d3ee);border:0;color:#0b0e17;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:13px;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Brick Breaker</h1>
    <div class="score-box"><small>SCORE · LIVES</small><b id="score">0 · 3</b></div>
  </div>
  <canvas id="canvas" width="440" height="360"></canvas>
  <div class="msg">Move mouse / drag to steer the paddle. Break every brick.</div>
  <button id="restartBtn">Restart</button>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;
const scoreEl=document.getElementById('score');

const paddleW=80, paddleH=10;
let paddleX, ball, bricks, score, lives, over, win;

const rows=5, cols=8, brickW=48, brickH=16, brickGap=6, brickTop=40, brickLeft=(W-(cols*(brickW+brickGap)-brickGap))/2;
const COLORS=['#ff4d8d','#f59e0b','#34d399','#22d3ee','#7c5cff'];

function initBricks(){
  bricks=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      bricks.push({x:brickLeft+c*(brickW+brickGap), y:brickTop+r*(brickH+brickGap), w:brickW, h:brickH, alive:true, color:COLORS[r%COLORS.length]});
    }
  }
}

function reset(){
  paddleX=W/2-paddleW/2;
  ball={x:W/2,y:H-40,vx:3,vy:-4,r:6};
  score=0; lives=3; over=false; win=false;
  initBricks();
  scoreEl.textContent=`${score} · ${lives}`;
}

function movePaddle(clientX){
  const rect=canvas.getBoundingClientRect();
  const scale=W/rect.width;
  paddleX=(clientX-rect.left)*scale - paddleW/2;
  paddleX=Math.max(0, Math.min(W-paddleW, paddleX));
}

canvas.addEventListener('mousemove', e=>movePaddle(e.clientX));
canvas.addEventListener('touchmove', e=>{ movePaddle(e.touches[0].clientX); e.preventDefault(); }, {passive:false});

function update(){
  if(over) return;
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.x-ball.r<0){ ball.x=ball.r; ball.vx*=-1; }
  if(ball.x+ball.r>W){ ball.x=W-ball.r; ball.vx*=-1; }
  if(ball.y-ball.r<0){ ball.y=ball.r; ball.vy*=-1; }

  if(ball.y+ball.r>H-30-paddleH && ball.y+ball.r<H-20 && ball.x>paddleX && ball.x<paddleX+paddleW && ball.vy>0){
    ball.vy*=-1;
    const hit=(ball.x-(paddleX+paddleW/2))/(paddleW/2);
    ball.vx = hit*4.5;
  }

  if(ball.y-ball.r>H){
    lives--;
    scoreEl.textContent=`${score} · ${lives}`;
    if(lives<=0){ over=true; }
    else { ball={x:W/2,y:H-40,vx:3,vy:-4,r:6}; }
  }

  for(const b of bricks){
    if(!b.alive) continue;
    if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
      b.alive=false;
      score+=10;
      scoreEl.textContent=`${score} · ${lives}`;
      const overlapLeft=ball.x+ball.r-b.x, overlapRight=b.x+b.w-(ball.x-ball.r);
      const overlapTop=ball.y+ball.r-b.y, overlapBottom=b.y+b.h-(ball.y-ball.r);
      const minOverlap=Math.min(overlapLeft,overlapRight,overlapTop,overlapBottom);
      if(minOverlap===overlapLeft || minOverlap===overlapRight) ball.vx*=-1; else ball.vy*=-1;
      break;
    }
  }

  if(bricks.every(b=>!b.alive)){ over=true; win=true; }
}

function draw(){
  ctx.fillStyle='#05070d';
  ctx.fillRect(0,0,W,H);

  for(const b of bricks){
    if(!b.alive) continue;
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
  }

  ctx.fillStyle='#eef1ff';
  ctx.fillRect(paddleX, H-30, paddleW, paddleH);

  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fillStyle='#22d3ee'; ctx.fill();

  if(over){
    ctx.fillStyle='rgba(5,7,13,.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#eef1ff';
    ctx.font='bold 22px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(win ? 'You Win! 🎉' : 'Game Over', W/2, H/2);
    ctx.font='14px sans-serif';
    ctx.fillStyle='#8b91ab';
    ctx.fillText(`Score: ${score}`, W/2, H/2+26);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

document.getElementById('restartBtn').addEventListener('click', reset);
reset();
loop();
</script>
</body>
</html>
