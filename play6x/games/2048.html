<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Play6x</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>6x</text></svg>">
<style>
  :root{--bg:#0b0e17;--tile:#161c31;--text:#eef1ff;--dim:#8b91ab;--primary:#7c5cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .wrap{width:100%;max-width:420px;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .hud h1{font-size:20px;margin:0;}
  .score-box{background:var(--tile);border-radius:10px;padding:8px 16px;text-align:center;}
  .score-box small{display:block;color:var(--dim);font-size:10px;}
  .score-box b{font-size:18px;}
  .board{background:#05070d;border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;touch-action:none;}
  .cell{aspect-ratio:1;background:#111629;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;transition:background .1s;}
  .msg{text-align:center;color:var(--dim);font-size:13px;margin-top:12px;}
  button{background:linear-gradient(90deg,var(--primary),#22d3ee);border:0;color:#0b0e17;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:13px;}
  .btnrow{display:flex;justify-content:center;margin-top:14px;}
  .overlay{position:absolute;inset:10px;background:rgba(5,7,13,.85);border-radius:12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  .overlay.show{display:flex;}
  .overlay h2{margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>2048</h1>
    <div class="score-box"><small>SCORE</small><b id="score">0</b></div>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay"><h2 id="overlayText">Game Over</h2><button id="restartBtn">Restart</button></div>
  </div>
  <div class="msg">Use arrow keys or swipe to merge tiles and reach 2048.</div>
  <div class="btnrow"><button id="newGameBtn">New Game</button></div>
</div>
<script>
const SIZE = 4;
let grid, score, over, won;
const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');

const COLORS = {2:'#3b3f5c',4:'#454a70',8:'#7c5cff',16:'#8a6bff',32:'#a855f7',64:'#c026d3',128:'#22d3ee',256:'#0ea5e9',512:'#34d399',1024:'#f59e0b',2048:'#ff4d8d'};

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

function addTile(){
  const empties=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) empties.push([r,c]);
  if(!empties.length) return;
  const [r,c]=empties[Math.floor(Math.random()*empties.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}

function render(){
  board.querySelectorAll('.cell').forEach(n=>n.remove());
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const v=grid[r][c];
      const cell=document.createElement('div');
      cell.className='cell';
      if(v){ cell.textContent=v; cell.style.background=COLORS[v]||'#ff4d8d'; cell.style.color = v<=4 ? '#eef1ff':'#0b0e17'; }
      board.appendChild(cell);
    }
  }
  scoreEl.textContent=score;
  board.appendChild(overlay);
}

function slideRow(row){
  let arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; if(arr[i]===2048) won=true; arr.splice(i+1,1); }
  }
  while(arr.length<SIZE) arr.push(0);
  return arr;
}

function rotate(g){
  const res=emptyGrid();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) res[c][SIZE-1-r]=g[r][c];
  return res;
}

function move(dir){
  if(over) return;
  let moved=false;
  let g=grid;
  let rotations = {left:0, up:1, right:2, down:3}[dir];
  for(let i=0;i<rotations;i++) g=rotate(g);
  const newG=g.map(row=>slideRow(row));
  let result=newG;
  for(let i=0;i<(4-rotations)%4;i++) result=rotate(result);
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(result[r][c]!==grid[r][c]) moved=true;
  grid=result;
  if(moved){
    addTile();
    render();
    if(won){ overlayText.textContent='You reached 2048! 🎉'; overlay.classList.add('show'); over=true; return; }
    if(!canMove()){ overlayText.textContent='Game Over'; overlay.classList.add('show'); over=true; }
  }
}

function canMove(){
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(!grid[r][c]) return true;
    if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return true;
    if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

function newGame(){
  grid=emptyGrid(); score=0; over=false; won=false;
  overlay.classList.remove('show');
  addTile(); addTile();
  render();
}

document.addEventListener('keydown', e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
});

let touchStart=null;
board.addEventListener('touchstart', e=>{ touchStart=[e.touches[0].clientX,e.touches[0].clientY]; }, {passive:true});
board.addEventListener('touchend', e=>{
  if(!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart[0];
  const dy=e.changedTouches[0].clientY-touchStart[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))>24){
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  }
  touchStart=null;
});

document.getElementById('restartBtn').addEventListener('click', newGame);
document.getElementById('newGameBtn').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
