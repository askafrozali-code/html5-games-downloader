<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris — Play6x</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>6x</text></svg>">
<style>
  :root{--bg:#0b0e17;--tile:#161c31;--text:#eef1ff;--dim:#8b91ab;--primary:#7c5cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .wrap{width:100%;max-width:420px;}
  .layout{display:flex;gap:14px;align-items:flex-start;justify-content:center;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hud h1{font-size:20px;margin:0;}
  .side{display:flex;flex-direction:column;gap:10px;width:110px;}
  .panel{background:var(--tile);border-radius:10px;padding:10px;text-align:center;}
  .panel small{display:block;color:var(--dim);font-size:10px;margin-bottom:4px;}
  .panel b{font-size:18px;}
  #next{width:80px;height:80px;margin:0 auto;background:#05070d;border-radius:8px;}
  canvas#board{background:#05070d;border-radius:12px;touch-action:none;}
  .msg{color:var(--dim);font-size:12px;margin-top:10px;text-align:center;}
  button{background:linear-gradient(90deg,var(--primary),#22d3ee);border:0;color:#0b0e17;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;font-size:13px;width:100%;margin-top:4px;}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
  .pad button{background:var(--tile);color:var(--text);padding:10px 0;font-size:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><h1>Tetris</h1></div>
  <div class="layout">
    <canvas id="board" width="200" height="400"></canvas>
    <div class="side">
      <div class="panel"><small>NEXT</small><canvas id="next" width="80" height="80"></canvas></div>
      <div class="panel"><small>SCORE</small><b id="score">0</b></div>
      <div class="panel"><small>LINES</small><b id="lines">0</b></div>
      <button id="restartBtn">Restart</button>
    </div>
  </div>
  <div class="msg">← → move · ↑ rotate · ↓ soft drop · Space hard drop</div>
  <div class="pad">
    <button id="btnLeft">←</button>
    <button id="btnRot">⟳</button>
    <button id="btnDown">↓</button>
    <button id="btnRight">→</button>
  </div>
</div>
<script>
const COLS=10, ROWS=20, CELL=20;
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const nextCanvas=document.getElementById('next');
const nctx=nextCanvas.getContext('2d');
const scoreEl=document.getElementById('score');
const linesEl=document.getElementById('lines');

const SHAPES={
  I:{color:'#22d3ee', cells:[[0,1],[1,1],[2,1],[3,1]]},
  J:{color:'#3b82f6', cells:[[0,0],[0,1],[1,1],[2,1]]},
  L:{color:'#f59e0b', cells:[[2,0],[0,1],[1,1],[2,1]]},
  O:{color:'#eab308', cells:[[1,0],[2,0],[1,1],[2,1]]},
  S:{color:'#34d399', cells:[[1,0],[2,0],[0,1],[1,1]]},
  Z:{color:'#ff4d8d', cells:[[0,0],[1,0],[1,1],[2,1]]},
  T:{color:'#a855f7', cells:[[1,0],[0,1],[1,1],[2,1]]},
};
const KEYS=Object.keys(SHAPES);

let grid, current, next, score, lines, over, dropTimer, dropInterval;

function emptyGrid(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }

function newPiece(){
  const key=KEYS[Math.floor(Math.random()*KEYS.length)];
  const shape=SHAPES[key];
  return { key, color:shape.color, cells: shape.cells.map(c=>[...c]), x:3, y:-1 };
}

function rotate(piece){
  if(piece.key==='O') return piece.cells.map(c=>[...c]);
  const cx=1, cy=1;
  return piece.cells.map(([x,y])=>{
    const rx = cx - (y-cy);
    const ry = cy + (x-cx);
    return [rx, ry];
  });
}

function collides(cells, ox, oy){
  for(const [cx,cy] of cells){
    const x=cx+ox, y=cy+oy;
    if(x<0||x>=COLS||y>=ROWS) return true;
    if(y>=0 && grid[y][x]) return true;
  }
  return false;
}

function lockPiece(){
  for(const [cx,cy] of current.cells){
    const x=current.x+cx, y=current.y+cy;
    if(y>=0) grid[y][x]=current.color;
  }
  clearLines();
  current=next;
  next=newPiece();
  drawNext();
  if(collides(current.cells, current.x, current.y)){
    over=true;
  }
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(grid[r].every(c=>c)){
      grid.splice(r,1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if(cleared){
    lines+=cleared;
    score += [0,100,300,500,800][cleared]*(1);
    linesEl.textContent=lines;
    scoreEl.textContent=score;
    dropInterval=Math.max(120, 600-lines*15);
  }
}

function move(dx){
  if(over) return;
  if(!collides(current.cells, current.x+dx, current.y)) current.x+=dx;
  draw();
}

function softDrop(){
  if(over) return;
  if(!collides(current.cells, current.x, current.y+1)) current.y+=1;
  else lockPiece();
  draw();
}

function hardDrop(){
  if(over) return;
  while(!collides(current.cells, current.x, current.y+1)) current.y+=1;
  lockPiece();
  draw();
}

function doRotate(){
  if(over) return;
  const rotated=rotate(current);
  if(!collides(rotated, current.x, current.y)) current.cells=rotated;
  else if(!collides(rotated, current.x-1, current.y)) { current.cells=rotated; current.x-=1; }
  else if(!collides(rotated, current.x+1, current.y)) { current.cells=rotated; current.x+=1; }
  draw();
}

function draw(){
  ctx.fillStyle='#05070d';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]){
        ctx.fillStyle=grid[r][c];
        ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
      }
    }
  }

  ctx.fillStyle=current.color;
  for(const [cx,cy] of current.cells){
    const x=current.x+cx, y=current.y+cy;
    if(y>=0) ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
  }

  if(over){
    ctx.fillStyle='rgba(5,7,13,.82)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#eef1ff';
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
  }
}

function drawNext(){
  nctx.fillStyle='#05070d';
  nctx.fillRect(0,0,80,80);
  nctx.fillStyle=next.color;
  for(const [cx,cy] of next.cells){
    nctx.fillRect(cx*16+8, cy*16+8, 14, 14);
  }
}

function tick(){
  if(!over) softDrop();
  dropTimer=setTimeout(tick, dropInterval);
}

function reset(){
  grid=emptyGrid();
  current=newPiece();
  next=newPiece();
  score=0; lines=0; over=false; dropInterval=600;
  scoreEl.textContent=score;
  linesEl.textContent=lines;
  clearTimeout(dropTimer);
  drawNext();
  draw();
  tick();
}

document.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if(e.key==='ArrowLeft') move(-1);
  else if(e.key==='ArrowRight') move(1);
  else if(e.key==='ArrowUp') doRotate();
  else if(e.key==='ArrowDown') softDrop();
  else if(e.key===' ') hardDrop();
});

document.getElementById('btnLeft').addEventListener('click', ()=>move(-1));
document.getElementById('btnRight').addEventListener('click', ()=>move(1));
document.getElementById('btnRot').addEventListener('click', doRotate);
document.getElementById('btnDown').addEventListener('click', softDrop);
document.getElementById('restartBtn').addEventListener('click', reset);

reset();
</script>
</body>
</html>
