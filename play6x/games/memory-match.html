<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Play6x</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>6x</text></svg>">
<style>
  :root{--bg:#0b0e17;--tile:#161c31;--text:#eef1ff;--dim:#8b91ab;--primary:#7c5cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .wrap{width:100%;max-width:420px;text-align:center;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hud h1{font-size:20px;margin:0;}
  .score-box{background:var(--tile);border-radius:10px;padding:8px 16px;}
  .score-box small{display:block;color:var(--dim);font-size:10px;}
  .score-box b{font-size:18px;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .card{aspect-ratio:1;border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none;transition:transform .15s, background .15s;border:1px solid #262d4a;}
  .card.flipped, .card.matched{background:#222a4d;}
  .card.matched{opacity:.55;cursor:default;}
  .msg{color:var(--dim);font-size:13px;margin-top:10px;}
  button{background:linear-gradient(90deg,var(--primary),#22d3ee);border:0;color:#0b0e17;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:13px;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Memory Match</h1>
    <div class="score-box"><small>MOVES · PAIRS</small><b id="score">0 · 0/8</b></div>
  </div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg">Flip two cards at a time to find matching pairs.</div>
  <button id="restartBtn">Restart</button>
</div>
<script>
const ICONS=['🎮','🚀','🐍','🏓','🧩','⚡','🎵','🍀'];
const board=document.getElementById('board');
const scoreEl=document.getElementById('score');
const msg=document.getElementById('msg');
let cards, flipped, matched, moves, lock;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function reset(){
  const deck=shuffle([...ICONS, ...ICONS]);
  cards=deck.map((icon,i)=>({id:i, icon, flipped:false, matched:false}));
  flipped=[]; matched=0; moves=0; lock=false;
  scoreEl.textContent=`${moves} · ${matched}/8`;
  msg.textContent='Flip two cards at a time to find matching pairs.';
  render();
}

function render(){
  board.innerHTML='';
  for(const c of cards){
    const el=document.createElement('div');
    el.className='card'+(c.flipped?' flipped':'')+(c.matched?' matched':'');
    el.textContent=(c.flipped||c.matched)?c.icon:'❔';
    el.addEventListener('click', ()=>flipCard(c.id));
    board.appendChild(el);
  }
}

function flipCard(id){
  if(lock) return;
  const c=cards.find(x=>x.id===id);
  if(!c || c.flipped || c.matched) return;
  c.flipped=true;
  flipped.push(c);
  render();
  if(flipped.length===2){
    lock=true;
    moves++;
    scoreEl.textContent=`${moves} · ${matched}/8`;
    const [a,b]=flipped;
    if(a.icon===b.icon){
      a.matched=true; b.matched=true;
      matched++;
      flipped=[];
      lock=false;
      scoreEl.textContent=`${moves} · ${matched}/8`;
      render();
      if(matched===8){
        msg.textContent=`Solved in ${moves} moves! 🎉`;
      }
    } else {
      setTimeout(()=>{
        a.flipped=false; b.flipped=false;
        flipped=[];
        lock=false;
        render();
      }, 700);
    }
  }
}

document.getElementById('restartBtn').addEventListener('click', reset);
reset();
</script>
</body>
</html>
